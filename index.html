    <meta charset="UTF-8" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('info_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
